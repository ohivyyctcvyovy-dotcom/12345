name: Build ImageLab AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImageLabAI/**'
      - '.github/workflows/imagelab-ai-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with native engine
        working-directory: ImageLabAI/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageLab-AI-debug
          path: ImageLabAI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
