name: Build ImageLab AI APK + model

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImageLabAI/**'
      - '.github/workflows/imagelab-ai-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK, CMake and platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the hosted Android SDK."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with native engine
        working-directory: ImageLabAI/android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK and SDXS model package
        shell: bash
        run: |
          mkdir -p release
          cp ImageLabAI/android/app/build/outputs/apk/debug/app-debug.apk release/ImageLabAI.apk
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://huggingface.co/concedo/sdxs-512-tinySDdistilled-GGUF/resolve/3144d898d61492f8382ffcabec055733fc5b2a0e/sdxs-512-tinySDdistilled_Q8_0.gguf?download=true" \
            --output release/sdxs-512-tinySDdistilled_Q8_0.gguf
          cat > release/LEIA-ME.txt <<'EOF'
          ImageLab AI - pacote de instalação

          1. Instale ImageLabAI.apk.
          2. Abra o app e use "Escolher modelo".
          3. Selecione sdxs-512-tinySDdistilled_Q8_0.gguf, extraído deste pacote.

          Modelo: SDXS-512 Tiny, quantização Q8_0, aproximadamente 683 MB.
          Origem: concedo/sdxs-512-tinySDdistilled-GGUF
          Licença indicada pelo autor: OpenRAIL++.
          O modelo é um arquivo separado; não está embutido dentro do APK.
          A execução depende da memória e compatibilidade do aparelho. Este modelo
          ainda não foi validado no Galaxy A04e.
          EOF

      - name: Upload APK separately for easy phone download
        uses: actions/upload-artifact@v4
        with:
          name: ImageLab-AI-APK
          path: release/ImageLabAI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK and model together
        uses: actions/upload-artifact@v4
        with:
          name: ImageLab-AI-APK-e-Modelo
          path: release/*
          if-no-files-found: error
          retention-days: 30
