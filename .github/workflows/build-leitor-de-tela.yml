name: Build APK do Leitor de Tela

on:
  push:
    paths:
      - 'leitor-de-tela/**'
      - '.github/workflows/build-leitor-de-tela.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: leitor-de-tela
        run: gradle assembleDebug
      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leitor-de-tela-v1
          name: Leitor de Tela para Android
          body: 'APK de teste gerado automaticamente. Baixe app-debug.apk e instale no Android.'
          files: leitor-de-tela/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
